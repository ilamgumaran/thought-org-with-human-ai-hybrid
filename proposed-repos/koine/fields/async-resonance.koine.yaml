      - { t: 0.20, intensity: 1.15, salience: 0.90, charge: { pos: 0.72, neg: 0.06 } }
      - { t: 0.24, intensity: 0.03, salience: 0.05, charge: { pos: 0.72, neg: 0.06 } }
      - { t: 0.36, intensity: 0.03, salience: 0.05, charge: { pos: 0.72, neg: 0.06 } }
      - { t: 0.39, intensity: 1.15, salience: 0.90, confidence: 0.76, charge: { pos: 0.72, neg: 0.06 } }
      - { t: 0.46, intensity: 1.15, salience: 0.90, charge: { pos: 0.72, neg: 0.06 } }
      - { t: 0.50, intensity: 0.03, salience: 0.05, charge: { pos: 0.72, neg: 0.06 } }
